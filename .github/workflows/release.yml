name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v1.0.0
        required: true
        type: string
      channel:
        description: Release channel; manual unstable builds are prereleases
        required: true
        default: unstable
        type: choice
        options:
          - unstable
          - stable

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/aimeng001/ktv-home
  RAW_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release-source:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require reviewed master source
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_NAME" != "master" ]]; then
              echo "Manual releases must run from master (got $GITHUB_REF_NAME)." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git fetch --no-tags origin master:refs/remotes/origin/master
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
              echo "Release tag must point to a commit reachable from master." >&2
              exit 1
            fi
          else
            echo "Unsupported release event: $GITHUB_EVENT_NAME." >&2
            exit 1
          fi

  release-meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    needs: release-source
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      artifact_version: ${{ steps.meta.outputs.artifact_version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      channel: ${{ steps.meta.outputs.channel }}
      unstable: ${{ steps.meta.outputs.unstable }}
    steps:
      - name: Resolve stable or unstable version
        id: meta
        env:
          RAW_VERSION: ${{ env.RAW_RELEASE_VERSION }}
          REQUESTED_CHANNEL: ${{ inputs.channel || '' }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          prefix=""
          [[ "$RAW_VERSION" == v* ]] && prefix="v"

          channel=stable
          if [[ "$REQUESTED_CHANNEL" == "unstable" || "$version" == *-* ]]; then
            channel=unstable
            [[ "$version" == *-* ]] || version="${version}-unstable"
          fi

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            :
          else
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          release_tag="${prefix}${version}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          [[ "$channel" == unstable ]] && echo "unstable=true" >> "$GITHUB_OUTPUT" || echo "unstable=false" >> "$GITHUB_OUTPUT"

  android-tv:
    name: Build signed TV APKs
    runs-on: ubuntu-latest
    needs: release-meta
    env:
      KTV_TV_VERSION_NAME: ${{ needs.release-meta.outputs.version_name }}
      KTV_TV_VERSION_CODE: ${{ needs.release-meta.outputs.version_code }}
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify FFmpeg extension
        run: echo "9feed2a29f7717955f579eff0373503ef3f8681734b053797fbda3cf62b3a5ab  app/libs/media3-decoder-ffmpeg.aar" | sha256sum -c -
      - name: Verify POSIX entrypoints
        working-directory: .
        run: python scripts/repo_portability_test.py
      - name: Prepare release signing keystore
        env:
          KTV_TV_KEYSTORE_BASE64: ${{ secrets.KTV_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KTV_TV_KEYSTORE_BASE64"
          printf '%s' "$KTV_TV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/home-ktv-release.keystore"
      - name: Build signed Release APKs
        env:
          KTV_TV_KEYSTORE: ${{ runner.temp }}/home-ktv-release.keystore
          KTV_TV_STORE_PASSWORD: ${{ secrets.KTV_TV_STORE_PASSWORD }}
          KTV_TV_KEY_ALIAS: ${{ secrets.KTV_TV_KEY_ALIAS }}
          KTV_TV_KEY_PASSWORD: ${{ secrets.KTV_TV_KEY_PASSWORD }}
        run: |
          test -n "$KTV_TV_STORE_PASSWORD"
          test -n "$KTV_TV_KEY_ALIAS"
          test -n "$KTV_TV_KEY_PASSWORD"
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Stage versioned APKs
        run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk \
            "staged-apks/home-ktv-tv-${{ needs.release-meta.outputs.version_name }}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/*arm64-v8a*.apk \
            "staged-apks/home-ktv-tv-${{ needs.release-meta.outputs.version_name }}-arm64-v8a.apk"
      - name: Upload signed Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: home-ktv-tv-${{ needs.release-meta.outputs.artifact_version }}-release
          path: android-tv/staged-apks/*.apk
          if-no-files-found: error

  windows-player:
    name: Build Windows x64 Player
    runs-on: windows-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore Windows Player
        run: dotnet restore windows-player/HomeKtv.Windows.sln
      - name: Run Windows Player tests
        run: dotnet test windows-player/HomeKtv.Windows.sln --no-restore -c Release
      - name: Publish self-contained Windows x64 Player (mpv prerequisite)
        run: >-
          dotnet publish windows-player/src/HomeKtv.Windows/HomeKtv.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version="${{ needs.release-meta.outputs.version_name }}"
          -o windows-player/staged/win-x64
      - name: Stage Windows Player prerequisites (mpv.exe instructions)
        shell: pwsh
        run: >-
          Copy-Item windows-player/README.md
          windows-player/staged/win-x64/README-WINDOWS-PLAYER.md
      - name: Package Windows x64 Player
        shell: pwsh
        run: >-
          Compress-Archive
          -Path windows-player/staged/win-x64/*
          -DestinationPath windows-player/staged/home-ktv-windows-player-${{ needs.release-meta.outputs.version_name }}-win-x64.zip
          -Force
      - name: Upload Windows x64 Release package
        uses: actions/upload-artifact@v4
        with:
          name: home-ktv-windows-player-${{ needs.release-meta.outputs.artifact_version }}-win-x64
          path: windows-player/staged/*.zip
          if-no-files-found: error

  image:
    name: Publish image with TV APKs
    runs-on: ubuntu-latest
    needs: [release-meta, android-tv, windows-player]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download signed TV APKs
        uses: actions/download-artifact@v4
        with:
          name: home-ktv-tv-${{ needs.release-meta.outputs.artifact_version }}-release
          path: downloaded-apks
      - name: Add TV APKs to Docker build context
        run: |
          mkdir -p dist/tv-apk
          cp "downloaded-apks/home-ktv-tv-${{ needs.release-meta.outputs.version_name }}-armeabi-v7a.apk" dist/tv-apk/
          cp "downloaded-apks/home-ktv-tv-${{ needs.release-meta.outputs.version_name }}-arm64-v8a.apk" dist/tv-apk/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=unstable,enable=${{ needs.release-meta.outputs.unstable == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-meta.outputs.unstable != 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KTV_RELEASE_VERSION=${{ needs.release-meta.outputs.version_name }}
            KTV_RELEASE_VERSION_CODE=${{ needs.release-meta.outputs.version_code }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-meta, android-tv, windows-player, image]
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: home-ktv-tv-${{ needs.release-meta.outputs.artifact_version }}-release
          path: release-assets
      - name: Download Windows Player artifact
        uses: actions/download-artifact@v4
        with:
          name: home-ktv-windows-player-${{ needs.release-meta.outputs.artifact_version }}-win-x64
          path: release-assets
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.release_tag }}
          name: Home KTV ${{ needs.release-meta.outputs.release_tag }} (${{ needs.release-meta.outputs.channel }})
          generate_release_notes: true
          prerelease: ${{ needs.release-meta.outputs.unstable == 'true' }}
          make_latest: ${{ needs.release-meta.outputs.unstable != 'true' }}
          files: |
            release-assets/*.apk
            release-assets/*.zip
