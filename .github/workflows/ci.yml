name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify POSIX entrypoints
        working-directory: .
        run: python scripts/repo_portability_test.py
      - name: Run server tests
        run: ./mvnw --batch-mode -T 1C test

  large-library-scan:
    name: Large library scan memory test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pre-pull postgres container image
        run: docker pull postgres:16-alpine
      - name: Run 10000-file scanAll test with constrained heap
        run: >-
          ./mvnw --batch-mode -T 1C
          -DrunLargeLibraryScanTest=true
          -DscanRows=10000
          -DargLine="-Xms128m -Xmx512m"
          -Dtest=LargeExternalLibraryScanTest
          test

  h5:
    name: H5 tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: h5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run H5 tests
        run: npm test
      - name: Build H5
        run: npm run build

  android-tv:
    name: TV release-variant checks
    runs-on: ubuntu-latest
    env:
      KTV_TV_VERSION_NAME: 0.1.0-unstable.${{ github.run_number }}
      KTV_TV_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Cache Android SDK components
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: ${{ runner.os }}-android-35-build-tools-35.0.0
      - name: Install Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify FFmpeg extension
        run: echo "9feed2a29f7717955f579eff0373503ef3f8681734b053797fbda3cf62b3a5ab  app/libs/media3-decoder-ffmpeg.aar" | sha256sum -c -
      - name: Run release-variant tests and lint
        run: ./gradlew --build-cache testReleaseUnitTest lintRelease

  windows-player:
    name: Windows Player tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows-player/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Windows Player
        run: dotnet build windows-player/HomeKtv.Windows.sln -c Release
      - name: Run Windows Player tests
        run: dotnet test windows-player/HomeKtv.Windows.sln -c Release --no-build

  compose-config:
    name: Compose configuration checks
    runs-on: ubuntu-latest
    env:
      KTV_DB_PASSWORD: ci-validation-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate every Compose definition
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docker-compose.yml
            docker-compose.dev.yml
            docker-compose.nas.yml
            docker-compose.prebuilt.yml
            docker-compose.ci.yml
            docker-compose.hardware.yml
            docker-compose.rockchip.yml
          )
          for file in "${files[@]}"; do
            echo "Validating $file"
            case "$file" in
              docker-compose.hardware.yml|docker-compose.rockchip.yml)
                docker compose -f docker-compose.yml -f "$file" config --quiet
                ;;
              *)
                docker compose -f "$file" config --quiet
                ;;
            esac
          done

  release-config:
    name: Release workflow contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release workflow contracts
        run: python scripts/release_workflow_test.py
      - name: Test merge-gate contracts
        run: python scripts/merge_gate_contract_test.py
