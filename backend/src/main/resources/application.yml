spring:
  application:
    name: home-ktv-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ktv}
    username: ${SPRING_DATASOURCE_USERNAME:ktv}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate          # 由 Flyway 建表，JPA 只校验映射
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      # Keep request parsing bounded before controller code calls MultipartFile#getBytes.
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0B

server:
  port: ${SERVER_PORT:8080}

build:
  git-sha: ${KTV_BUILD_GIT_SHA:${BUILD_GIT_SHA:unknown}}
  time: ${KTV_BUILD_TIME:${BUILD_TIME:unknown}}

# 应用自定义配置
app:
  source-library-path: ${KTV_SOURCE_LIBRARY_PATH:/source-music}
  ktv-library-path: ${KTV_LIBRARY_PATH:/music}
  library-mode: ${KTV_LIBRARY_MODE:MANAGED}
  avatar-library-path: ${KTV_AVATAR_LIBRARY_PATH:/avatar-library}
  data-path: ${KTV_DATA_PATH:./data}
  music-provider-rate-limit:
    min-interval-ms: ${KTV_MUSIC_PROVIDER_MIN_INTERVAL_MS:5000}
    daily-limit: ${KTV_MUSIC_PROVIDER_DAILY_LIMIT:300}
  scan:
    missing-guard:
      minimum-previous-files: ${KTV_SCAN_MISSING_GUARD_MIN_FILES:1000}
      minimum-seen-ratio: ${KTV_SCAN_MISSING_GUARD_MIN_SEEN_RATIO:0.50}
      allow-mass-missing: ${KTV_SCAN_ALLOW_MASS_MISSING:false}
  config-master-key-path: ${KTV_CONFIG_MASTER_KEY_PATH:/data/secrets/config.key}
  admin-password: ${KTV_ADMIN_PASSWORD:}
  player-credential: ${KTV_PLAYER_CREDENTIAL:}
  ffprobe-path: ${KTV_FFPROBE_PATH:ffprobe}
  transcode:
    ffmpeg-path: ${KTV_FFMPEG_PATH:ffmpeg}
    timeout-seconds: ${KTV_TRANSCODE_TIMEOUT_SECONDS:1800}
    dri-path: ${KTV_DRI_PATH:/dev/dri}
    drm-sys-path: ${KTV_DRM_SYS_PATH:/sys/class/drm}
    rkmpp-device-path: ${KTV_RKMPP_DEVICE_PATH:/dev/mpp_service}
  discovery:
    enabled: ${KTV_DISCOVERY_ENABLED:true}
    instance-name: ${KTV_DISCOVERY_NAME:家庭KTV}
    udp-port: 18888
  release:
    version: ${KTV_RELEASE_VERSION:0.1.0-dev}
    version-code: ${KTV_RELEASE_VERSION_CODE:1}
    armeabi-v7a-apk: ${KTV_RELEASE_ARMEABI_V7A_APK:classpath:/static/tv-apk/home-ktv-tv-armeabi-v7a.apk}
    arm64-v8a-apk: ${KTV_RELEASE_ARM64_V8A_APK:classpath:/static/tv-apk/home-ktv-tv-arm64-v8a.apk}
    announcement:
      enabled: ${KTV_RELEASE_NOTICE_ENABLED:true}
      id: ${KTV_RELEASE_NOTICE_ID:${KTV_RELEASE_VERSION:0.1.0-dev}}
      title: ${KTV_RELEASE_NOTICE_TITLE:Android TV 客户端已更新}
      message: ${KTV_RELEASE_NOTICE_MESSAGE:新版本已随服务端发布，请根据电视设备架构下载并安装对应的 Android TV APK。升级后请重新扫描曲库；外部只读曲库请保持源文件不变，Managed 曲库请按管理页面提示操作。}
  ai:
    enabled: ${KTV_AI_ENABLED:false}
    base-url: ${KTV_AI_BASE_URL:}
    api-key: ${KTV_AI_API_KEY:}
    model: ${KTV_AI_MODEL:}
    bulk-model: ${KTV_AI_BULK_MODEL:${KTV_AI_MODEL:}}
    reasoning-model: ${KTV_AI_REASONING_MODEL:}
    json-mode: ${KTV_AI_JSON_MODE:AUTO}
    bulk-concurrency: ${KTV_AI_BULK_CONCURRENCY:2}
    reasoning-concurrency: ${KTV_AI_REASONING_CONCURRENCY:1}
    auto-apply-confidence: ${KTV_AI_AUTO_APPLY_CONFIDENCE:0.90}
    allow-private-network: ${KTV_AI_ALLOW_PRIVATE_NETWORK:false}
    connect-timeout-seconds: 10
    read-timeout-seconds: 60

logging:
  level:
    com.homektv: INFO
