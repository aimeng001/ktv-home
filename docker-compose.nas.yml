# Standalone NAS deployment. Set KTV_SOURCE_MUSIC_DIR to point at the existing
# NAS library; it defaults to ./source-music for a local deployment.
# NAS 独立部署文件。可用 KTV_SOURCE_MUSIC_DIR 指向现有 NAS 曲库，默认使用 ./source-music。
# Before deployment, set KTV_DB_PASSWORD in .env. It is referenced by both
# PostgreSQL and Home KTV, so the two services always use the same password.
# 部署前请在 .env 中设置 KTV_DB_PASSWORD；数据库和应用会同时引用该密码，避免配置不一致。
name: home-ktv

x-db-name: &db-name "${KTV_DB_NAME:-ktv}"
x-db-user: &db-user "${KTV_DB_USER:-ktv}"
x-db-password: &db-password "${KTV_DB_PASSWORD:?KTV_DB_PASSWORD must be set}"
x-timezone: &timezone "${TZ:-Asia/Shanghai}"

services:
  db:
    image: "${KTV_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:16-alpine"
    container_name: ${KTV_DB_CONTAINER_NAME:-ktv-db}
    environment:
      POSTGRES_DB: *db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
      TZ: *timezone
    volumes:
      - type: bind
        source: "${KTV_PG_DIR:-./postgres}"
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m

  ktv:
    image: "${KTV_RELEASE_IMAGE:-ghcr.io/aimeng001/ktv-home:latest}"
    container_name: ${KTV_APP_CONTAINER_NAME:-ktv-app}
    environment:
      SERVER_PORT: "${KTV_HTTP_PORT:-8080}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${KTV_DB_NAME:-ktv}"
      SPRING_DATASOURCE_USERNAME: *db-user
      SPRING_DATASOURCE_PASSWORD: *db-password
      KTV_SOURCE_LIBRARY_PATH: /source-music
      KTV_LIBRARY_PATH: /music
      KTV_LIBRARY_MODE: EXTERNAL_READ_ONLY
      KTV_AVATAR_LIBRARY_PATH: /avatar-library
      KTV_DATA_PATH: /data
      KTV_MUSIC_PROVIDER_MIN_INTERVAL_MS: ${KTV_MUSIC_PROVIDER_MIN_INTERVAL_MS:-5000}
      KTV_MUSIC_PROVIDER_DAILY_LIMIT: ${KTV_MUSIC_PROVIDER_DAILY_LIMIT:-300}
      # Set this before deployment to unlock /m/admin; empty keeps admin APIs disabled.
      # 部署前请设置此项以解锁 /m/admin；留空会关闭管理接口。
      KTV_ADMIN_PASSWORD: "${KTV_ADMIN_PASSWORD:-}"
      KTV_PLAYER_CREDENTIAL: "${KTV_PLAYER_CREDENTIAL:-}"
      KTV_DISCOVERY_ENABLED: "true"
      KTV_DISCOVERY_NAME: "${KTV_DISCOVERY_NAME:-家庭KTV}"
      KTV_AI_ENABLED: "${KTV_AI_ENABLED:-false}"
      KTV_AI_BASE_URL: "${KTV_AI_BASE_URL:-https://api.deepseek.com}"
      KTV_AI_API_KEY: "${KTV_AI_API_KEY:-}"
      KTV_AI_MODEL: "${KTV_AI_MODEL:-deepseek-v4-flash}"
      KTV_AI_AUTO_APPLY_CONFIDENCE: "${KTV_AI_AUTO_APPLY_CONFIDENCE:-0.90}"
      KTV_AI_ALLOW_PRIVATE_NETWORK: "${KTV_AI_ALLOW_PRIVATE_NETWORK:-false}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms256m -Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data -XX:+ExitOnOutOfMemoryError}"
      TZ: *timezone
    mem_limit: ${KTV_APP_MEMORY_LIMIT:-4g}
    ports:
      # Web/API/WebSocket/media / 网页、API、WebSocket 与媒体流
      - "${KTV_HTTP_PORT:-8080}:${KTV_HTTP_PORT:-8080}/tcp"
      # The TV discovery protocol always uses UDP 18888 / 电视端发现协议固定使用 UDP 18888
      - "18888:18888/udp"
    volumes:
      - type: bind
        # Relative to the directory containing this Compose project.
        # 相对于此 Compose 项目所在目录。
        source: "${KTV_SOURCE_MUSIC_DIR:-./source-music}"
        target: /source-music
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${KTV_MUSIC_DIR:-./music}"
        target: /music
        bind:
          create_host_path: true
      - type: bind
        source: "${KTV_DATA_DIR:-./data}"
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: "${KTV_AVATAR_LIBRARY_DIR:-./avatar-library}"
        target: /avatar-library
        read_only: true
        bind:
          create_host_path: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/api/ready | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
