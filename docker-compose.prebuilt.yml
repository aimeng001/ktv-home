# Run the prebuilt multi-architecture image published by GitHub Actions.
# 使用 GitHub Actions 发布的多架构预编译镜像，无需在本机编译。
# Usage / 用法: docker compose -f docker-compose.prebuilt.yml up -d --pull always --wait
name: home-ktv

services:
  # PostgreSQL stores application metadata and is only exposed inside Docker.
  # PostgreSQL 保存应用元数据，仅在 Docker 网络内开放。
  db:
    image: ${KTV_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:16-alpine
    container_name: ${KTV_DB_CONTAINER_NAME:-ktv-db}
    environment:
      POSTGRES_DB: ${KTV_DB_NAME:-ktv}
      POSTGRES_USER: ${KTV_DB_USER:-ktv}
      POSTGRES_PASSWORD: ${KTV_DB_PASSWORD:-ktv}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${KTV_PG_DIR:-./postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m

  ktv:
    # Override KTV_RELEASE_IMAGE to pin a release tag instead of latest.
    # 可通过 KTV_RELEASE_IMAGE 指定版本标签，避免始终使用 latest。
    image: ${KTV_RELEASE_IMAGE:-ghcr.io/aimeng001/ktv-home:latest}
    container_name: ${KTV_APP_CONTAINER_NAME:-ktv-app}
    environment:
      SERVER_PORT: ${KTV_HTTP_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${KTV_DB_NAME:-ktv}
      SPRING_DATASOURCE_USERNAME: ${KTV_DB_USER:-ktv}
      SPRING_DATASOURCE_PASSWORD: ${KTV_DB_PASSWORD:-ktv}
      KTV_SOURCE_LIBRARY_PATH: /source-music
      KTV_LIBRARY_PATH: /music
      KTV_LIBRARY_MODE: ${KTV_LIBRARY_MODE:-MANAGED}
      KTV_DATA_PATH: /data
      KTV_ADMIN_PASSWORD: ${KTV_ADMIN_PASSWORD:-}
      KTV_DISCOVERY_ENABLED: ${KTV_DISCOVERY_ENABLED:-true}
      KTV_DISCOVERY_NAME: ${KTV_DISCOVERY_NAME:-家庭KTV}
      KTV_AI_ENABLED: ${KTV_AI_ENABLED:-false}
      KTV_AI_BASE_URL: ${KTV_AI_BASE_URL:-https://api.deepseek.com}
      KTV_AI_API_KEY: ${KTV_AI_API_KEY:-}
      KTV_AI_MODEL: ${KTV_AI_MODEL:-deepseek-v4-flash}
      KTV_AI_AUTO_APPLY_CONFIDENCE: ${KTV_AI_AUTO_APPLY_CONFIDENCE:-0.90}
      KTV_AI_ALLOW_PRIVATE_NETWORK: ${KTV_AI_ALLOW_PRIVATE_NETWORK:-false}
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms256m -Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data -XX:+ExitOnOutOfMemoryError}"
      TZ: ${TZ:-Asia/Shanghai}
    mem_limit: ${KTV_APP_MEMORY_LIMIT:-4g}
    ports:
      # HTTP API/UI port / HTTP API 与界面端口
      - "${KTV_HTTP_PORT:-8080}:${KTV_HTTP_PORT:-8080}/tcp"
      # The TV discovery protocol always uses UDP 18888 / 电视端发现协议固定使用 UDP 18888
      - "18888:18888/udp"
    volumes:
      - type: bind
        source: ${KTV_SOURCE_MUSIC_DIR:-./source-music}
        target: /source-music
        read_only: ${KTV_SOURCE_MUSIC_READ_ONLY:-false}
        bind:
          create_host_path: true
      - type: bind
        source: ${KTV_MUSIC_DIR:-./music}
        target: /music
        bind:
          create_host_path: true
      - type: bind
        source: ${KTV_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
